name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Custom domain (tvtracker.alteriorfantasy.com) serves at the root, so
          # assets load from '/'. (On the bare Pages subpath it would be
          # /${{ github.event.repository.name }}/ instead — see public/CNAME.)
          VITE_BASE: /
          # TMDB token — add this in repo Settings -> Secrets and variables ->
          # Actions -> New repository secret (name: VITE_TMDB_TOKEN).
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
          # Google OAuth client ID for Drive sync (public value; stored as a
          # secret only for consistency). Add as repo secret VITE_GOOGLE_CLIENT_ID.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Trakt API client ID for reviews + Trakt sync (PKCE, no secret).
          # Add as repo secret VITE_TRAKT_CLIENT_ID.
          VITE_TRAKT_CLIENT_ID: ${{ secrets.VITE_TRAKT_CLIENT_ID }}
          # Web Push: VAPID public key + Cloudflare Worker URL (both public).
          # Optional — leave unset to keep in-app-only notifications. See
          # worker/README.md. Add as repo secrets VITE_VAPID_PUBLIC / VITE_PUSH_API.
          VITE_VAPID_PUBLIC: ${{ secrets.VITE_VAPID_PUBLIC }}
          VITE_PUSH_API: ${{ secrets.VITE_PUSH_API }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
