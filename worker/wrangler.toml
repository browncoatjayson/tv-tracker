name = "tvtracker-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Runs every 5 minutes to deliver any "airing soon" wake-ups that are now due.
[triggers]
crons = ["*/5 * * * *"]

# KV namespace that stores each device's push subscription + upcoming fire times.
# Create it with:  wrangler kv namespace create SUBS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SUBS"
id = "a369f82fe49640df8df90a63d45013fb"

# Public, non-secret config (set with `wrangler deploy` or in the dashboard).
# VAPID_PRIVATE is a SECRET — set it with `wrangler secret put VAPID_PRIVATE`.
[vars]
VAPID_PUBLIC = "BA52wRovt9-fcED5c43kSgbGsMy_hH8pgu_faxGY7IMA_p4vjm-FprAZVcD8Cgyze2PjOYSLVNEHo9-qlH65f_0"
VAPID_SUBJECT = "mailto:browncoatjayson@gmail.com"
# Comma-separated list of origins allowed to call the API (your app URL + localhost).
ALLOWED_ORIGINS = "https://browncoatjayson.github.io,http://localhost:5173,http://localhost:5174"
