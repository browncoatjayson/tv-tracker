name = "tvtracker-trakt"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public, non-secret config (set with `wrangler deploy` or in the dashboard).
# The Trakt client ID is set as a secret so it isn't committed here:
#   wrangler secret put TRAKT_CLIENT_ID
[vars]
# Comma-separated origins allowed to call this proxy (your app URL + localhost).
ALLOWED_ORIGINS = "https://tvtracker.alteriorfantasy.com,https://browncoatjayson.github.io,http://localhost:5173,http://localhost:5174"
