name = "tvtracker-music"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public, non-secret config. MusicBrainz is keyless; the paid sources added later
# (Tunefind / WhatSong via RapidAPI) would set their keys as secrets:
#   wrangler secret put TUNEFIND_KEY   /   wrangler secret put RAPIDAPI_KEY
[vars]
# Comma-separated origins allowed to call this proxy (your app URL + localhost).
ALLOWED_ORIGINS = "https://tvtracker.alteriorfantasy.com,https://browncoatjayson.github.io,http://localhost:5173,http://localhost:5174"
